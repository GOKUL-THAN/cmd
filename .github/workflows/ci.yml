name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go and dependencies ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        module:
          - components/saas-control-plane
          - components/satellite-gateway
          - components/vsatellite
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.23.4'
          cache: false
      - name: Check formatting of changed Go files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [[ -n "$base_sha" ]]; then
            files=$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" -- '${{ matrix.module }}/*.go' '${{ matrix.module }}/**/*.go')
          else
            files=$(git ls-files -- '${{ matrix.module }}/*.go' '${{ matrix.module }}/**/*.go')
          fi
          [[ -z "$files" ]] && exit 0
          unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            printf '%s\n' "$unformatted" | xargs gofmt -d
            exit 1
          fi
      - name: Prepare monorepo module
        run: |
          bash .github/scripts/prepare-go-module.sh '${{ matrix.module }}' "$RUNNER_TEMP/clm-module"
          cd "$RUNNER_TEMP/clm-module"
          go mod edit -module github.com/m2p/clm
          go mod tidy
      - name: Vet
        run: cd "$RUNNER_TEMP/clm-module" && go vet ./...
      - name: Test
        run: cd "$RUNNER_TEMP/clm-module" && go test ./... -count=1
      - name: Test with Race Detector
        run: cd "$RUNNER_TEMP/clm-module" && go test -race ./...
      - name: Build
        run: cd "$RUNNER_TEMP/clm-module" && go build ./...
      - name: Security Static Analysis (Gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          cd "$RUNNER_TEMP/clm-module"
          gosec -exclude-dir=web ./...
      - name: Dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          cd "$RUNNER_TEMP/clm-module"
          govulncheck ./...

  syntax:
    name: Script and configuration syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check JavaScript syntax
        run: |
          node --check components/saas-control-plane/web/admin-portal/app.js
          node --check components/satellite-gateway/web/gateway-ui/app.js
          node --check components/shared/legacy-dashboard/app.js
      - name: Check shell syntax
        run: |
          bash -n .github/scripts/prepare-go-module.sh
          bash -n components/shared/scripts/install-cli.sh
          bash -n components/shared/scripts/install-server.sh
          bash -n components/shared/scripts/install-satellite.sh
          bash -n components/saas-control-plane/deploy/deploy-test.sh
          bash -n components/saas-control-plane/deploy/run-tests.sh
          bash -n components/satellite-gateway/deploy/build-src-bundle.sh
          bash -n components/shared/scripts/go-staged.sh
      - name: Check JSON and YAML syntax
        run: |
          python3 -m json.tool components/saas-control-plane/deploy/keycloak/clm-realm.json >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval-all '.' \
            /work/components/saas-control-plane/configs/server.yaml \
            /work/components/saas-control-plane/configs/server-test.yaml \
            /work/components/satellite-gateway/configs/satellite.yaml \
            /work/components/satellite-gateway/configs/satellite-test.yaml \
            /work/components/saas-control-plane/deploy/docker-compose.yml \
            /work/components/saas-control-plane/deploy/docker-compose.test.yml \
            /work/deploy/k8s/network-policies.yaml \
            /work/deploy/k8s/saas-control-plane-deployment.yaml \
            /work/deploy/k8s/satellite-gateway-daemonset.yaml \
            /work/.github/workflows/ci.yml >/dev/null
      - name: Check Kubernetes security invariants
        run: |
          if grep -R -nE 'cidr:[[:space:]]*(0\.0\.0\.0/0|::/0)' deploy/k8s; then
            echo "Kubernetes policies must not allow unrestricted network ranges."
            exit 1
          fi
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "NetworkPolicy" and .metadata.name == "allow-control-plane-ingress") | .spec.ingress[] | select(.ports[0].port == 9090) | .from[] | select(.namespaceSelector.matchLabels."kubernetes.io/metadata.name" == "clm-in-vpc" and .podSelector.matchLabels."app.kubernetes.io/name" == "clm-satellite-gateway")' \
            /work/deploy/k8s/network-policies.yaml >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "Deployment" and .metadata.name == "clm-saas-control-plane") | .spec.template.spec.securityContext.runAsNonRoot == true and .spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation == false and .spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem == true' \
            /work/deploy/k8s/saas-control-plane-deployment.yaml >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "Deployment" and .metadata.name == "clm-customer-satellite-gateway") | .spec.template.spec.securityContext.runAsNonRoot == true and .spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation == false and .spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem == true' \
            /work/deploy/k8s/satellite-gateway-daemonset.yaml >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "ServiceAccount" and .metadata.name == "clm-control-plane-sa" and .metadata.namespace == "clm-production") | .automountServiceAccountToken == false' \
            /work/deploy/k8s/saas-control-plane-deployment.yaml >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "Deployment" and .metadata.name == "clm-saas-control-plane") | .spec.template.spec.serviceAccountName == "clm-control-plane-sa" and .spec.template.spec.automountServiceAccountToken == false' \
            /work/deploy/k8s/saas-control-plane-deployment.yaml >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "ServiceAccount" and .metadata.name == "clm-satellite-sa" and .metadata.namespace == "clm-in-vpc") | .automountServiceAccountToken == false' \
            /work/deploy/k8s/satellite-gateway-daemonset.yaml >/dev/null
          docker run --rm -v "$PWD:/work" mikefarah/yq:4.44.6 \
            eval --exit-status \
            'select(.kind == "Deployment" and .metadata.name == "clm-customer-satellite-gateway") | .spec.template.spec.serviceAccountName == "clm-satellite-sa" and .spec.template.spec.automountServiceAccountToken == false' \
            /work/deploy/k8s/satellite-gateway-daemonset.yaml >/dev/null

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Terraform formatting
        run: |
          docker run --rm -v "$PWD:/work" -w /work hashicorp/terraform:1.10.5 \
            fmt -check -diff deploy/terraform/aws/main.tf deploy/terraform/azure/main.tf deploy/terraform/gcp/main.tf
      - name: Validate cloud Terraform modules without remote state access
        run: |
          for module in deploy/terraform/aws deploy/terraform/azure deploy/terraform/gcp; do
            docker run --rm -v "$PWD:/work" -w "/work/$module" hashicorp/terraform:1.10.5 \
              init -backend=false -input=false -no-color
            docker run --rm -v "$PWD:/work" -w "/work/$module" hashicorp/terraform:1.10.5 \
              validate -no-color
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks 8.24.2
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source /repo --redact --verbose

  filesystem-and-sbom:
    name: Filesystem, IaC, and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy filesystem and configuration scan 0.58.2
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.2 fs \
            --exit-code 1 --severity CRITICAL --scanners vuln,secret,misconfig /src
      - name: Generate CycloneDX SBOM with Syft 1.18.1
        run: |
          docker run --rm -v "$PWD:/src" anchore/syft:v1.18.1 \
            dir:/src -o cyclonedx-json=/src/sbom.cdx.json
          test -s sbom.cdx.json
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clm-filesystem-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
      - name: Attest SBOM build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: sbom.cdx.json

  containers:
    name: Container image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images
        run: |
          docker build -t clm-server:ci -f components/saas-control-plane/deploy/Dockerfile.server components/saas-control-plane
          bash .github/scripts/prepare-go-module.sh components/satellite-gateway "$RUNNER_TEMP/gateway-image"
          docker build -t clm-satellite:ci -f "$RUNNER_TEMP/gateway-image/deploy/Dockerfile.satellite" "$RUNNER_TEMP/gateway-image"
          docker build -t clm-vsatellite:ci -f components/vsatellite/deploy/Dockerfile .
      - name: Require non-root runtime users
        run: |
          for image in clm-server:ci clm-satellite:ci clm-vsatellite:ci; do
            image_user=$(docker image inspect --format '{{.Config.User}}' "$image")
            if [[ -z "$image_user" || "$image_user" =~ ^(root|0)(:|$) ]]; then
              echo "Image $image has no non-root runtime user configured." >&2
              exit 1
            fi
          done
      - name: Scan images with Trivy 0.58.2
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image \
            --exit-code 1 --severity CRITICAL clm-server:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image \
            --exit-code 1 --severity CRITICAL clm-satellite:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image \
            --exit-code 1 --severity CRITICAL clm-vsatellite:ci

  postgres-rls-test:
    name: PostgreSQL 15 RLS and Immutable Audit Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: superuser_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize Isolated Role Architecture (Superuser Setup)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: clm_test
          PGUSER: postgres
          PGPASSWORD: superuser_ci_secret
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/setup_ci_postgres_roles.sql

      - name: "Apply Migrations as Migration Owner (Table Ownership: clm_table_owner)"
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: clm_test
          PGUSER: clm_migration_owner
          PGPASSWORD: migration_ci_secret
        run: |
          for file in $(ls components/saas-control-plane/deploy/migrations/*.sql | sort); do
            if [ "$(basename "$file")" = "000_keycloak_db.sql" ]; then
              echo "Skipping container init script: $file"
              continue
            fi
            echo "Applying migration: $file"
            psql -v ON_ERROR_STOP=1 -c "SET ROLE clm_table_owner;" -f "$file"
          done

      - name: Set up Go for PostgreSQL-backed approval tests
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.23.4'
          cache: false

      - name: Run tenant-isolated Go integration tests with isolated fixture credentials
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: clm_test
          PGUSER: postgres
          PGPASSWORD: superuser_ci_secret
          CLM_TEST_APP_DB_DSN: postgres://clm_app_login:app_ci_secret@127.0.0.1:5432/clm_test?sslmode=disable
          CLM_TEST_SUPERUSER_DB_DSN: postgres://postgres:superuser_ci_secret@127.0.0.1:5432/clm_test?sslmode=disable
        run: |
          bash .github/scripts/prepare-go-module.sh components/saas-control-plane "$RUNNER_TEMP/clm-module"
          cd "$RUNNER_TEMP/clm-module"
          go mod edit -module github.com/m2p/clm
          go mod tidy
          go test ./internal/api/rest/handlers ./internal/saas/approval -count=1
          CLM_TEST_DB_REQUIRED=1 \
          CLM_TEST_DB_DSN="postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable" \
            go test ./internal/store/postgres -run '^(TestApprovalRepositoryEnforcesTenantContext|TestCertificateRepositoryListsAcrossTenantsWithScopedQueries|TestUserRepositoryEnforcesTenantScope)$' -count=1

      - name: Execute Live RLS and Immutable Audit Tests through clm_app_login
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: clm_test
          PGUSER: clm_app_login
          PGPASSWORD: app_ci_secret
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/test_postgres_rls_live.sql

      - name: Execute Table Owner FORCE RLS Test as clm_table_owner
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: clm_test
          PGUSER: clm_table_owner
          PGPASSWORD: owner_ci_secret
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/test_postgres_table_owner_rls.sql

      - name: Execute Superuser Negative-Control Test as postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: clm_test
          PGUSER: postgres
          PGPASSWORD: superuser_ci_secret
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/test_postgres_superuser_negative_control.sql

  node-test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
      - name: Run enterprise scenario tests
        run: node scripts/verify_scenarios_a_to_h.js
      - name: Run lifecycle tests
        run: node scripts/test_lifecycle_26_stages.js
      - name: Run feature registry tests
        run: node scripts/test_400_features.js
      - name: Run corporate module tests
        run: node scripts/test_corporate_modules.js
